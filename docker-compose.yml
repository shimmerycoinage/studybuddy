services:
  db:
    image: postgres:15-alpine
    container_name: studybuddy_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studybuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studybuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: studybuddy_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/studybuddy
      JWT_SECRET: ${JWT_SECRET}
      MATERIALS_DIR: /data/materials
    volumes:
      - materials_data:/data/materials
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  materials_data: